services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    expose:
      - "6379"

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hermes
      MYSQL_ROOT_PASSWORD: hermes_secret_pass
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql://root:hermes_secret_pass@db:3306/hermes
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env

volumes:
  mysql_data:
